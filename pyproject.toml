[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spatioloji_s"
version = "0.4.5"
description = "Image-based spatial transcriptomics analysis for CosMx, MERFISH, and Xenium"
readme = "README.md"
authors = [
  {name = "Ji Wang", email = "gynecoloji@gmail.com"}
]
maintainers = [
  {name = "Ji Wang", email = "gynecoloji@gmail.com"}
]
keywords = ["spatial transcriptomics", "single cell", "CosMx", "MERFISH", "Xenium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# PEP 639 SPDX form. The matching "License ::" classifier is intentionally
# absent — declaring both is an error for build backends that support PEP 639.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.12"

# ── Core dependencies (always installed) ──────────────────────────────────────
dependencies = [
    "typer",
    # Imported directly by cli.py. Typer already vendors it transitively, but
    # depend on what you import.
    "rich",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "opencv-python",
    "networkx",
    "natsort",
    "tqdm",
    "geopandas",
    "shapely",
    "joblib>=1.3",
    # numba is imported at module scope by spatial.point.patterns and
    # spatial.polygon.morphology (@njit decorators run at import time), so it
    # cannot be deferred behind a try/except — it is genuinely required.
    "numba",
    # scikit-image backs _grid_method(), the only code path identify_interface()
    # uses, so interface detection does not work without it.
    "scikit-image",
]

# ── Optional dependencies (installed on demand) ───────────────────────────────
[project.optional-dependencies]

spatial = [
    "geopandas",
    "shapely",
]

clustering = [
    "leidenalg",
    "igraph",
    "pynndescent",
]

reduction = [
    "umap-learn",
]

# scikit-misc provides the LOESS that Seurat v3 and scanpy use to fit the
# mean-variance trend in highly_variable_genes(method='seurat_v3'). Without it
# the package falls back to a built-in LOESS, which agrees closely but not
# exactly; install this extra to reproduce scanpy's gene list bit for bit.
hvg = [
    "scikit-misc",
]

batch = [
    "harmonypy",
    "combat",
    "statsmodels",
]

deg = [
    "statsmodels",
    "pydeseq2",
]

anndata = [
    "anndata",
    "scanpy",
]

# processing/annotation.py wraps CellTypist. Both imports are resolved lazily in
# _import_celltypist(), so this extra is genuinely optional.
#
# Deliberately NOT pinned against scikit-learn. celltypist <= 1.7.1 calls
# LogisticRegression(multi_class=...), removed in scikit-learn 1.7, but that
# only breaks celltypist.train() — which this module never calls. Its public API
# is list/download/annotate, all of which work on current scikit-learn. Pinning
# here would downgrade a core dependency for every user of this extra to fix a
# code path the package does not use.
annotation = [
    "celltypist",
    "anndata",
]

ripley = [
    "pointpats",
]

decoupler = [
    "decoupler",
]

imputation = [
    # DEPRECATED: "DCA" was listed here but is never imported anywhere in the
    # source tree. Resolving it dragged TensorFlow + Keras (~60 packages) into
    # [all] for no benefit, so it has been removed. Re-add it only alongside a
    # real `import dca` call site.
    #
    # magic-impute: install separately in conda env
    # conda create -n magic_env && pip install magic-impute
    #
    # scvi-tools backs scvi_impute(); it is the only importable extra here.
    "scvi-tools",
]

test = [
    "coverage",
    "pytest",
    "ruff",
    "ty",
    "ipdb",
]

# NOTE: the [docs] extra was removed together with the docs/ tree and the
# Read the Docs integration. Re-add it when the documentation is rebuilt, and
# keep its theme pinned to whatever html_theme the new conf.py selects.

# Every pip-installable analysis feature at once: pip install spatioloji-s[all]
#
# This is the union of the feature extras above minus core dependencies (which
# are always installed) and minus [imputation]. The deep-learning backends
# (scvi-tools, and magic-impute) are deliberately excluded: both are designed to
# run in a dedicated environment via the `conda_env=` argument on scvi_impute()
# and magic_impute(), and pulling PyTorch into a default install is a multi-GB
# surprise. Install them explicitly with spatioloji-s[imputation] if you want
# them in-process.
all = [
    "leidenalg", "igraph", "pynndescent",
    "umap-learn",
    "harmonypy", "combat", "statsmodels",
    "pydeseq2",
    "anndata", "scanpy",
    "pointpats",
    "decoupler",
    "celltypist",
]

# ── Project URLs ───────────────────────────────────────────────────────────────
[project.urls]
bugs = "https://github.com/gynecoloji/spatioloji_s/issues"
changelog = "https://github.com/gynecoloji/spatioloji_s/blob/main/CHANGELOG.md"
homepage = "https://github.com/gynecoloji/spatioloji_s"

# ── CLI entry point ────────────────────────────────────────────────────────────
[project.scripts]
spatioloji_s = "spatioloji_s.cli:app"

# ── Packaging ──────────────────────────────────────────────────────────────────
# Explicit discovery rather than setuptools auto-discovery, so the shipped
# package set does not depend on the backend version that happens to build it.
[tool.setuptools.packages.find]
where = ["src"]

# Ships the PEP 561 marker so type checkers honour the inline annotations.
[tool.setuptools.package-data]
spatioloji_s = ["py.typed"]

# ── Tool configs (unchanged) ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
