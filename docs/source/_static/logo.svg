<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56beff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#56beff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f39c12" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="edgeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#56beff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="edgeGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56beff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#56beff"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#95a5a6"/>
      <stop offset="50%" stop-color="#ecf0f1"/>
      <stop offset="100%" stop-color="#95a5a6"/>
    </linearGradient>

    <!-- Cell fill gradients -->
    <radialGradient id="cell1" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="cell2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#27ae60" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="cell3" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#56beff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="cell4" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f39c12" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="cell5" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8e44ad" stop-opacity="0.12"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dash animation for edges -->
    <style>
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes dashFlowReverse {
        to { stroke-dashoffset: 40; }
      }
      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 4; opacity: 0.8; }
        50% { r: 6; opacity: 1; }
      }
      @keyframes particleMove1 {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes fadeInOut {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.4; }
      }
      .edge-animated {
        stroke-dasharray: 8 6;
        animation: dashFlow 1.5s linear infinite;
      }
      .edge-animated-rev {
        stroke-dasharray: 8 6;
        animation: dashFlowReverse 1.8s linear infinite;
      }
      .cell-pulse {
        animation: pulseOpacity 3s ease-in-out infinite;
      }
      .cell-pulse-delay1 {
        animation: pulseOpacity 3.5s ease-in-out 0.5s infinite;
      }
      .cell-pulse-delay2 {
        animation: pulseOpacity 4s ease-in-out 1s infinite;
      }
      .orbit-ring {
        animation: orbitSpin 20s linear infinite;
        transform-origin: 300px 260px;
      }
      .orbit-ring-rev {
        animation: orbitSpin 30s linear infinite reverse;
        transform-origin: 300px 260px;
      }
    </style>
  </defs>

  <!-- Background (transparent for embedding) -->

  <!-- Subtle orbital rings -->
  <g opacity="0.12">
    <ellipse class="orbit-ring" cx="300" cy="260" rx="190" ry="190" fill="none" stroke="#56beff" stroke-width="0.5" stroke-dasharray="4 8"/>
    <ellipse class="orbit-ring-rev" cx="300" cy="260" rx="155" ry="155" fill="none" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="3 10"/>
    <ellipse class="orbit-ring" cx="300" cy="260" rx="220" ry="220" fill="none" stroke="#2ecc71" stroke-width="0.3" stroke-dasharray="2 12"/>
  </g>

  <!-- Central glow -->
  <circle cx="300" cy="260" r="140" fill="url(#glowCenter)">
    <animate attributeName="r" values="130;150;130" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ COMMUNICATION EDGES (behind cells) ═══ -->
  <g filter="url(#glow)">
    <!-- Juxtacrine edges (short, between adjacent) -->
    <line x1="255" y1="210" x2="300" y2="175" stroke="url(#edgeGrad1)" stroke-width="1.8" class="edge-animated" opacity="0.7"/>
    <line x1="300" y1="175" x2="355" y2="210" stroke="url(#edgeGrad2)" stroke-width="1.5" class="edge-animated-rev" opacity="0.6"/>
    <line x1="255" y1="210" x2="240" y2="270" stroke="url(#edgeGrad3)" stroke-width="1.5" class="edge-animated" opacity="0.6"/>
    <line x1="355" y1="210" x2="365" y2="270" stroke="url(#edgeGrad1)" stroke-width="1.8" class="edge-animated-rev" opacity="0.7"/>
    <line x1="240" y1="270" x2="265" y2="330" stroke="url(#edgeGrad2)" stroke-width="1.5" class="edge-animated" opacity="0.6"/>
    <line x1="365" y1="270" x2="340" y2="330" stroke="url(#edgeGrad3)" stroke-width="1.5" class="edge-animated-rev" opacity="0.6"/>
    <line x1="265" y1="330" x2="340" y2="330" stroke="url(#edgeGrad1)" stroke-width="1.8" class="edge-animated" opacity="0.7"/>
    <line x1="240" y1="270" x2="365" y2="270" stroke="url(#edgeGrad2)" stroke-width="1.2" class="edge-animated-rev" opacity="0.4"/>
    <line x1="300" y1="175" x2="300" y2="355" stroke="url(#edgeGrad3)" stroke-width="1.0" class="edge-animated" opacity="0.3"/>

    <!-- Secreted edges (longer range, curved) -->
    <path d="M205 190 Q160 250 200 320" fill="none" stroke="#f39c12" stroke-width="1" class="edge-animated" opacity="0.4"/>
    <path d="M395 190 Q440 250 400 320" fill="none" stroke="#2ecc71" stroke-width="1" class="edge-animated-rev" opacity="0.4"/>
    <path d="M255 165 Q300 120 355 165" fill="none" stroke="#9b59b6" stroke-width="1" class="edge-animated" opacity="0.35"/>
    <path d="M230 340 Q300 390 375 340" fill="none" stroke="#56beff" stroke-width="1" class="edge-animated-rev" opacity="0.35"/>
  </g>

  <!-- ═══ CELL SHAPES (diverse morphologies) ═══ -->
  <g>
    <!-- Cell 1: top — Irregular jagged tumor cell (red) -->
    <path d="M280,148 L298,138 L318,142 L335,155 L340,172 L332,188 L318,196
             L305,200 L288,198 L272,190 L260,178 L258,162 Z"
      fill="url(#cell1)" stroke="#e74c3c" stroke-width="1.5" class="cell-pulse" opacity="0.85"
      stroke-linejoin="miter">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Cell 2: upper-left — Spindle fibroblast (green, narrow tapered ends) -->
    <path d="M205,212 C210,205 220,192 235,188 C245,186 255,190 265,196
             C270,200 274,206 272,212 C270,218 262,226 250,232
             C238,238 222,238 212,232 C206,226 202,218 205,212 Z"
      fill="url(#cell2)" stroke="#2ecc71" stroke-width="1.5" class="cell-pulse-delay1" opacity="0.85">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </path>

    <!-- Cell 3: upper-right — Round immune/T-cell (blue, nearly circular) -->
    <circle cx="358" cy="215" r="30"
      fill="url(#cell3)" stroke="#56beff" stroke-width="1.5" class="cell-pulse-delay2" opacity="0.85">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Cell 4: lower-left — Extremely elongated cell (orange, needle-like diagonal) -->
    <path d="M190,242 C195,240 205,238 218,244 C225,248 230,255 234,265
             C238,278 240,295 238,310 C236,322 230,332 225,335
             C220,337 216,330 215,320 C213,305 212,288 213,272
             C214,258 210,248 205,244 Z"
      fill="url(#cell4)" stroke="#f39c12" stroke-width="1.5" class="cell-pulse" opacity="0.85">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- Cell 5: lower-right — Stellate/dendritic cell (purple, star-like projections) -->
    <path d="M358,250 L368,258 L385,255 L378,270 L392,282 L378,288
             L380,305 L365,298 L352,315 L348,298 L332,295 L340,280
             L328,268 L342,264 L340,252 Z"
      fill="url(#cell5)" stroke="#9b59b6" stroke-width="1.5" class="cell-pulse-delay1" opacity="0.85"
      stroke-linejoin="round">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
    </path>

    <!-- Cell 6: center — Smooth ovoid epithelial hub cell (teal, oval) -->
    <ellipse cx="295" cy="240" rx="38" ry="30"
      fill="none" stroke="#5dade2" stroke-width="1.8" class="cell-pulse-delay2" opacity="0.9"
      transform="rotate(-12, 295, 240)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Cell 7: bottom-center — Amorphous/blobby macrophage (coral, irregular blob) -->
    <path d="M262,295 C270,282 288,278 305,282 C322,286 335,296 340,312
             C342,325 335,340 320,346 C305,350 285,348 270,340
             C255,330 250,312 262,295 Z"
      fill="url(#cell1)" stroke="#e67e22" stroke-width="1.5" class="cell-pulse-delay2" opacity="0.75">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ═══ CELL CENTROIDS (centered in each cell shape) ═══ -->
  <g filter="url(#glow)">
    <!-- Cell 1: jagged tumor — center ~(300, 170) -->
    <circle cx="300" cy="170" fill="#e74c3c" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Cell 2: spindle fibroblast — center ~(238, 212) -->
    <circle cx="238" cy="212" fill="#2ecc71" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <!-- Cell 3: round immune — center (358, 215) -->
    <circle cx="358" cy="215" fill="#56beff" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <!-- Cell 4: elongated needle — center ~(220, 288) -->
    <circle cx="220" cy="288" fill="#f39c12" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.8s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <!-- Cell 5: stellate dendritic — center ~(358, 280) -->
    <circle cx="358" cy="280" fill="#9b59b6" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <!-- Cell 6: ovoid epithelial — center (295, 240) -->
    <circle cx="295" cy="240" fill="#5dade2" opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <!-- Cell 7: blob macrophage — center ~(300, 315) -->
    <circle cx="300" cy="315" fill="#e67e22" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.6s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
  </g>

  <!-- ═══ FLOATING PARTICLES (ligand/receptor signals) ═══ -->
  <g filter="url(#glow)" opacity="0.7">
    <!-- Particle set 1 -->
    <circle cx="0" cy="0" r="2" fill="#e74c3c">
      <animateMotion dur="3s" repeatCount="indefinite" path="M255,210 Q280,190 300,175"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#2ecc71">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M355,210 Q330,240 295,240"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1.5" fill="#56beff">
      <animateMotion dur="4s" repeatCount="indefinite" path="M240,270 Q268,255 295,240"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#f39c12">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M295,240 Q320,280 340,330"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1.5" fill="#9b59b6">
      <animateMotion dur="3.8s" repeatCount="indefinite" path="M265,330 Q280,300 295,240"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Extra particles for density -->
    <circle cx="0" cy="0" r="1.5" fill="#e74c3c">
      <animateMotion dur="4.2s" repeatCount="indefinite" begin="1s" path="M300,175 Q340,200 355,210"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4.2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="0" cy="0" r="1.5" fill="#5dade2">
      <animateMotion dur="3.6s" repeatCount="indefinite" begin="0.5s" path="M365,270 Q330,275 295,240"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- ═══ OUTER SCATTER DOTS (background tissue) ═══ -->
  <g opacity="0.25">
    <circle cx="150" cy="160" r="2" fill="#e74c3c"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="180" r="1.5" fill="#2ecc71"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="350" r="2" fill="#56beff"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="340" r="1.5" fill="#f39c12"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="260" r="1.5" fill="#9b59b6"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="260" r="2" fill="#e74c3c"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="185" cy="200" r="1" fill="#2ecc71"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="415" cy="210" r="1" fill="#56beff"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="310" r="1.5" fill="#f39c12"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="445" cy="310" r="1" fill="#9b59b6"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="150" r="1" fill="#5dade2"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="360" r="1.5" fill="#e67e22"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ DNA HELIX ACCENT (bottom-left corner) ═══ -->
  <g transform="translate(95, 370) scale(0.5)" opacity="0.2">
    <path d="M0,0 Q15,-8 30,0 Q45,8 60,0 Q75,-8 90,0 Q105,8 120,0" fill="none" stroke="#56beff" stroke-width="2">
      <animate attributeName="d" values="M0,0 Q15,-8 30,0 Q45,8 60,0 Q75,-8 90,0 Q105,8 120,0;M0,0 Q15,8 30,0 Q45,-8 60,0 Q75,8 90,0 Q105,-8 120,0;M0,0 Q15,-8 30,0 Q45,8 60,0 Q75,-8 90,0 Q105,8 120,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 Q15,8 30,0 Q45,-8 60,0 Q75,8 90,0 Q105,-8 120,0" fill="none" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="d" values="M0,0 Q15,8 30,0 Q45,-8 60,0 Q75,8 90,0 Q105,-8 120,0;M0,0 Q15,-8 30,0 Q45,8 60,0 Q75,-8 90,0 Q105,8 120,0;M0,0 Q15,8 30,0 Q45,-8 60,0 Q75,8 90,0 Q105,-8 120,0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ═══ TEXT: spatioloji_s ═══ -->
  <g filter="url(#textGlow)">
    <text x="300" y="445" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="2" fill="url(#textGrad)">
      spatioloji
      <tspan fill="#a78bfa" font-weight="300">_s</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="300" y="480" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="300" letter-spacing="3" fill="url(#subtitleGrad)" opacity="0.9">
    IMAGE-BASED SPATIAL TRANSCRIPTOMICS
  </text>

  <!-- Decorative line under text -->
  <line x1="200" y1="495" x2="400" y2="495" stroke="url(#textGrad)" stroke-width="1" opacity="0.6">
    <animate attributeName="x1" values="250;200;250" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="350;400;350" dur="3s" repeatCount="indefinite"/>
  </line>


</svg>
