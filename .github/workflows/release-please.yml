name: release-please

# Automates versioning + releases from Conventional Commit messages.
# On every push to the default branch, release-please opens/updates a "release
# PR" that bumps the version (pyproject.toml, src/spatioloji_s/__init__.py,
# CITATION.cff) and updates CHANGELOG.md. Merging that PR tags the version and
# publishes a GitHub Release — which triggers the Zenodo webhook to mint a DOI.
#
# One-time repo setting required: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" → enabled.
#
# NOTE: `main` is this repository's only long-lived branch — release cutting and
# the default branch both live here, and `dev` has been retired. Feature work
# branches off `main` and merges back via PR. If a second integration branch is
# ever reintroduced, release-please must still run on exactly one of them,
# otherwise it opens competing release PRs.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      # In manifest mode release-please prefixes per-package outputs with the
      # package path, except for the root package which is unprefixed. Take the
      # unprefixed name first and fall back, so this works either way.
      tag: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing is chained here rather than left to publish.yml's own
  # `release: published` trigger. GitHub will not start a workflow from an event
  # created with the default GITHUB_TOKEN, so that trigger never fires for a
  # release-please release — v0.4.3 was tagged and released but never uploaded.
  # Calling the workflow directly sidesteps the restriction without introducing
  # a long-lived PAT, which would undo the point of PyPI trusted publishing.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      # Reusable workflows can only narrow what the caller grants, so the OIDC
      # permission the PyPI upload needs has to be granted here too.
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
