name: release-please

# Automates versioning + releases from Conventional Commit messages.
# On every push to the default branch, release-please opens/updates a "release
# PR" that bumps the version (pyproject.toml, src/spatioloji_s/__init__.py,
# CITATION.cff) and updates CHANGELOG.md. Merging that PR tags the version and
# publishes a GitHub Release — which triggers the Zenodo webhook to mint a DOI.
#
# One-time repo setting required: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" → enabled.
#
# NOTE: `main` is this repository's only long-lived branch — release cutting and
# the default branch both live here, and `dev` has been retired. Feature work
# branches off `main` and merges back via PR. If a second integration branch is
# ever reintroduced, release-please must still run on exactly one of them,
# otherwise it opens competing release PRs.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
